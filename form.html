<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário - Academia-Estacio</title>
    <link rel="stylesheet" href="css.css">
</head>

<body>
    <a href="academia.html">PAGINA INICIAL</a>

    <div class="container">
        <h2>Formulario Academia Estacio</h2>
        <form action="inscricao.php" method="POST"> 

            
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            </div>

            <div class="input-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(XX) XXXXX-XXXX" required>
            </div>

            <div class="input-group">
                <label for="data-nascimento">Data de Nascimento</label>
                <input type="date" id="data-nascimento" name="data-nascimento" required>
            </div>

            <button type="submit" class="btn-submit">Inscrever-se</button>
        </form>

    </div>

</body>

</html>
